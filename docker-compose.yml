services:
  database:
    image: postgres:16-alpine
    container_name: garage_inventory_parts_finder_db
    environment:
      POSTGRES_DB: garage_inventory_parts_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5422:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garage_inventory_parts_finder"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
